<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>contact sheet</title>
<style>
  body { font-family: sans-serif; background: #eee; margin: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  figure { margin: 0; background: #fff; padding: 8px; border-radius: 8px; }
  img { width: 100%; display: block; border-radius: 6px; }
  figcaption { font-weight: bold; padding-top: 6px; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
  const names = ['hero','offer-1','offer-2','offer-3','dish-1','dish-2','dish-3','dish-4',
    'menu-1','menu-2','menu-3','menu-4','menu-5','menu-6','menu-7','menu-8','story']
  const sizes = { hero: 480, offer: 480, dish: 320, menu: 320, story: 640 }
  const g = document.getElementById('g')
  for (const n of names) {
    const w = sizes[n.split('-')[0]]
    g.insertAdjacentHTML('beforeend',
      `<figure><img src="/images/${n}-${w}.webp" alt="${n}"><figcaption>${n}</figcaption></figure>`)
  }
</script>
</body>
</html>
